<title>一步训练全景图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: two columns on wide screens (tall diagram | sticky explanation), stacked on phones */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --fg:#1d2420; --muted:#66716a; --line:#c9d2cc;
  --param:#dfe9fb; --paramStroke:#2f6fd6; --new:#fde6d6; --newStroke:#c2571a; --op:#eef1ef; --opStroke:#8a968f;
  --fwd:#2f6fd6; --bwd:#c23b3b; --upd:#2b8a57; --res:#7a5bd1;
  --display:"Noto Serif SC",serif; --body:"Noto Sans SC",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1c2320; --fg:#e6ece8; --muted:#94a19a; --line:#3a4640;
  --param:#1f2c44; --paramStroke:#6fa3ff; --new:#3a2a1f; --newStroke:#f08a4b; --op:#232b27; --opStroke:#7d8a83;
  --fwd:#6fa3ff; --bwd:#ff7a7a; --upd:#5cc98d; --res:#a98bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1c2320; --fg:#e6ece8; --muted:#94a19a; --line:#3a4640;
  --param:#1f2c44; --paramStroke:#6fa3ff; --new:#3a2a1f; --newStroke:#f08a4b; --op:#232b27; --opStroke:#7d8a83;
  --fwd:#6fa3ff; --bwd:#ff7a7a; --upd:#5cc98d; --res:#a98bff; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:900;font-size:2rem;margin:0;text-wrap:balance}
p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:14px;border-radius:3px;border:1.5px solid}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
svg{display:block;width:100%;min-width:520px;height:auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:820px){.side{position:static}}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.phases div{font-size:.82rem;text-align:center;padding:4px 2px;border-radius:6px;background:var(--op);color:var(--muted);font-weight:500}
.phases div.on{color:var(--bg);font-weight:700}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.ctrl button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 14px;cursor:pointer}
.ctrl button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
button:focus-visible{outline:2px solid var(--fwd);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:1.15rem;text-wrap:balance}
.tag{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:1px 10px;border:1.5px solid}
.shape{font-family:var(--mono);font-size:.88rem;color:var(--muted)}
.code{font-family:var(--mono);font-size:.85rem;background:var(--op);border-radius:6px;padding:6px 10px;overflow-x:auto;white-space:pre}
.node{cursor:pointer}
.node rect,.node circle{transition:stroke-width .25s, filter .25s}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <h1>一步训练全景图</h1>
  <p class="muted">例子：输入“小明吃”，让模型猜下一个字，正确答案是“米”。图从下往上读。数字用的是你的 <code>minigpt.py</code>：d=64，词表 31 个字。点任意方块看解释，或者按“下一步”跟着走一遍。</p>
  <div class="legend">
    <span><i class="sw" style="background:var(--param);border-color:var(--paramStroke)"></i>就是 wx+b（有要学的参数）</span>
    <span><i class="sw" style="background:var(--new);border-color:var(--newStroke)"></i>新东西：注意力（词和词交流）</span>
    <span><i class="sw" style="background:var(--op);border-color:var(--opStroke)"></i>固定的计算（没参数要学）</span>
    <span><i class="sw" style="background:transparent;border-color:var(--res)"></i>残差捷径</span>
  </div>

  <div class="main">
    <div class="diagram"><svg id="svg" viewBox="0 0 720 1140" role="img" aria-label="Transformer 训练一步的架构图"></svg></div>
    <div class="side">
      <div class="phases" id="phases"><div>① 前向</div><div>② 清零</div><div>③ 反向</div><div>④ 更新</div></div>
      <div class="ctrl">
        <button id="prev">上一步</button>
        <button id="next" class="primary">下一步</button>
        <button id="play">▶ 播放</button>
        <button id="reset">重来</button>
      </div>
      <div class="card" id="card"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// kind: p = wx+b 参数层, n = 注意力, o = 固定计算, a = 残差加法
const N=[
 {id:"input",y:1080,kind:"o",t:"输入：小 明 吃",s:"3 个字 → 3 个编号",
  f:"先用分词器把文字变成编号。这里一个字一个编号，比如 小=17、明=15、吃=5。",
  b:"输入是固定的数据，没有参数，梯度到这里就结束了。"},
 {id:"embed",y:1000,kind:"p",t:"词向量表 E + 位置向量表 P",s:"(3, 64)",
  f:"按编号查表，每个字取出 64 个数；再加上“第 0、1、2 位”的位置向量。\n查表其实就是 one-hot 向量 × 矩阵 E，所以也是一个 wx（没有 b）。",
  code:"x = E[ids] + P[0:3]",
  b:"梯度最后传到这里：E 里“小、明、吃”这 3 行、P 里前 3 行收到梯度，其它行这一步不变。"},
 {id:"ln1",y:920,kind:"o",t:"LayerNorm",s:"(3, 64)",
  f:"把每个字的 64 个数调成均值 0、方差 1，防止数字越叠越大。（它有两个很小的缩放参数，可以先忽略。）",
  b:"梯度穿过去，继续往下。"},
 {id:"qkv",y:845,kind:"p",t:"Q = x·Wq　K = x·Wk　V = x·Wv",s:"各 (3, 64)",
  f:"三个普通的 wx+b，同一个 x 乘三个不同的矩阵，得到“我在找什么 / 我是什么 / 我能给什么”。这时每个字的 Q、K、V 还是完整的 64 维。",
  code:"Q = x @ Wq + bq   # 和你熟悉的 wx+b 一样",
  b:"收到梯度后算出 ∂loss/∂Wq、∂Wk、∂Wv：这三个矩阵知道往哪改，才能让“吃”更会找到有用的字。"},
 {id:"split",y:775,kind:"o",t:"切成 4 个头",s:"(3, 64) → 4 × (3, 16)",
  f:"把 Q、K、V 的 64 维各切成 4 段，每段 16 维，分给 4 个头。只是把数字重新排一下，没有参数，也不增加参数。",
  code:"q = q.view(B, 3, 4, 16).transpose(1, 2)   # (B, 4头, 3字, 16维)",
  b:"梯度按原样拼回 64 维，交给 Q、K、V。"},
 {id:"attn",y:700,kind:"n",t:"4 个头并行：softmax(Q·Kᵀ/√16)·V",s:"每头 (3, 3) 权重",
  f:"这是 wx+b 里没有的新东西。4 个头各自用自己那 16 维的 Q、K 打分、softmax、混合自己的 V，互不干扰。\n每个头一张 3×3 的注意力图（图里的小方格，越深越关注）。因为起点随机不同，训练后会学成不同分工，比如：头 1 看自己，头 2 看前一个字，头 3 看第一个字，头 4 平均看。（小方格是示意，不是真实训练结果。）\n和 wx+b 的关键区别：这里的“权重”是根据输入现算的，换一句话就换一套。因果遮罩让右上角永远是空的。",
  code:"w = softmax(q @ k.transpose(-2,-1) / 4)   # (B, 4, 3, 3)\nout = w @ v                              # (B, 4, 3, 16)",
  b:"梯度分别传回 4 个头的 Q、K、V。每个头拿到的梯度不同，所以越学越不一样。这一步本身没有参数。"},
 {id:"concat",y:625,kind:"o",t:"4 个头拼回 64 维",s:"4 × (3, 16) → (3, 64)",
  f:"把 4 个头各自的 16 维结果首尾接起来，变回每个字 64 维。",
  code:"out = out.transpose(1, 2).reshape(B, 3, 64)",
  b:"梯度切回 4 段，分别送回 4 个头。"},
 {id:"proj",y:555,kind:"p",t:"输出投影 Wo",s:"(3, 64)",
  f:"又一个 wx+b。拼接后的 64 维里，前 16 维只来自头 1、后 16 维只来自头 4……Wo 把它们混合起来，4 个头的发现在这里汇总。",
  code:"a = out @ Wo + bo",
  b:"算出 ∂loss/∂Wo，然后继续往下传。"},
 {id:"add1",y:485,kind:"a",t:"⊕",s:"(3, 64)",
  f:"残差：x = x + a。不是用注意力结果替换原向量，而是在原来的基础上加一点。紫色线就是“原来的 x”绕过来的路。",
  code:"x = x + a",
  b:"加法的导数是 1，所以梯度在这里原样复制成两份：一份沿紫色捷径直接往下（不打折），一份穿过注意力那条路。这就是深层网络还能训得动的原因。"},
 {id:"ln2",y:415,kind:"o",t:"LayerNorm",s:"(3, 64)",
  f:"再标准化一次，给 FFN 用。",
  b:"梯度穿过去。"},
 {id:"ffn",y:340,kind:"p",t:"FFN：W1 → ReLU → W2",s:"64 → 256 → 64",
  f:"就是你上周写的 MLP：两个 wx+b 中间夹一个非线性。每个字各算各的，不和别的字交流。",
  code:"f = relu(x @ W1 + b1) @ W2 + b2",
  b:"算出 ∂loss/∂W1、∂W2，和上周 mlp_adam.py 完全一样。"},
 {id:"add2",y:270,kind:"a",t:"⊕",s:"(3, 64)",
  f:"第二个残差：x = x + f。一个 block 到这里结束。真模型会把虚线框里的这一套重复 L 次（minigpt 2 次，GPT-2 12 次）。",
  code:"x = x + f",
  b:"梯度再次一分为二：一份走捷径，一份穿过 FFN。"},
 {id:"head",y:195,kind:"p",t:"输出层 W_head",s:"(3, 64) → (3, 31)",
  f:"最后一个 wx+b：把每个位置的 64 维向量变成 31 个分数，词表里每个字一个分。我们只看“吃”这个位置的 31 个分数。",
  code:"logits = x @ W_head + b   # 31 个分数",
  b:"算出 ∂loss/∂W_head：让“米”的分数高一点，别的低一点。"},
 {id:"softmax",y:125,kind:"o",t:"softmax → 概率",s:"31 个概率，和为 1",
  f:"31 个分数变成 31 个概率。假设现在 p(米)=0.27、p(西)=0.25、p(面)=0.24……",
  b:"梯度很简单：正确答案“米”的分数被往上推，其它字的分数被往下压。"},
 {id:"loss",y:55,kind:"o",t:"交叉熵 loss = −log p(米)",s:"一个数",
  f:"答案是“米”，只看模型给“米”的概率：loss = −log 0.27 = 1.31。越接近 0 越好。前向到此结束。",
  code:"loss = F.cross_entropy(logits, y)",
  b:"反向从这里出发：loss.backward() 先算 loss 对最上面的导数，再一层层往下。"},
];
const byId=Object.fromEntries(N.map(n=>[n.id,n]));
const fwd=N.map(n=>n.id);
// timeline: forward 13 steps, zero_grad, backward 13 steps, update
const T=[...fwd.map(id=>({ph:0,id})),{ph:1,id:null},...[...fwd].reverse().map(id=>({ph:2,id})),{ph:3,id:null}];
let k=-1, sel=null, timer=null;

function draw(){
  const step=T[k]||null, ph=step?step.ph:-1, cur=step?step.id:sel;
  const C={p:[css("--param"),css("--paramStroke")],n:[css("--new"),css("--newStroke")],o:[css("--op"),css("--opStroke")],a:[css("--panel"),css("--res")]};
  const fg=css("--fg"),mu=css("--muted"),res=css("--res"),ln=css("--line");
  const flow= ph===2?css("--bwd"):ph===3?css("--upd"):css("--fwd");
  let h="";
  // block group
  h+=`<rect x="130" y="250" width="470" height="702" rx="14" fill="none" stroke="${mu}" stroke-dasharray="6 6"/>`;
  h+=`<text x="595" y="244" text-anchor="end" font-size="13" fill="${mu}">Transformer block（重复 L 层）</text>`;
  // main spine
  h+=`<line x1="360" y1="1057" x2="360" y2="78" stroke="${ln}" stroke-width="3"/>`;
  // arrows direction marks
  for(let i=0;i<N.length-1;i++){if(N[i].id==="attn")continue;const y=(N[i].y+N[i+1].y)/2;h+=`<path d="M352 ${y+6} L360 ${y-4} L368 ${y+6}" fill="none" stroke="${mu}" stroke-width="2"/>`;}
  // residual paths
  const resOn = cur==="add1"||cur==="add2";
  h+=`<path d="M360 962 L170 962 L170 485 L342 485" fill="none" stroke="${res}" stroke-width="${resOn?5:3}" stroke-linejoin="round"/>`;
  h+=`<path d="M360 466 L200 466 L200 270 L342 270" fill="none" stroke="${res}" stroke-width="${resOn?5:3}" stroke-linejoin="round"/>`;
  h+=`<text x="160" y="760" font-size="12" fill="${res}" transform="rotate(-90 160 760)" text-anchor="middle">残差：原来的 x 绕过来</text>`;
  // nodes
  N.forEach(n=>{
    const [fill,st]=C[n.kind], on=n.id===cur;
    const glow = ph===3 && n.kind==="p";
    const sw = on||glow ? 4 : 1.5, stroke = on ? flow : glow ? css("--upd") : st;
    h+=`<g class="node" data-id="${n.id}" tabindex="0" role="button" aria-label="${n.t}">`;
    if(n.id==="attn"){
      const HW=[[[1],[.2,.8],[.1,.1,.8]],[[1],[.9,.1],[.1,.8,.1]],[[1],[.85,.15],[.8,.1,.1]],[[1],[.5,.5],[.33,.33,.34]]];
      h+=`<text x="360" y="${n.y-38}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${st}">${n.t}</text>`;
      HW.forEach((m,hd)=>{
        const bx=215+hd*74;
        h+=`<rect x="${bx}" y="${n.y-30}" width="68" height="60" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
        for(let r=0;r<3;r++)for(let c=0;c<3;c++){
          const v=c<=r?m[r][c]:0;
          h+=`<rect x="${bx+6+c*11}" y="${n.y-24+r*11}" width="10" height="10" fill="${st}" fill-opacity="${c<=r?0.12+0.88*v:0}" stroke="${st}" stroke-opacity=".35" stroke-width=".6"/>`;
        }
        h+=`<text x="${bx+56}" y="${n.y-4}" text-anchor="middle" font-size="12" font-weight="700" fill="${fg}">头${hd+1}</text>`;
        h+=`<text x="${bx+34}" y="${n.y+23}" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono,monospace" fill="${mu}">16 维</text>`;
      });
    } else if(n.kind==="a"){
      h+=`<circle cx="360" cy="${n.y}" r="19" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><text x="360" y="${n.y+7}" text-anchor="middle" font-size="22" font-weight="700" fill="${res}">+</text>`;
    } else {
      h+=`<rect x="215" y="${n.y-23}" width="290" height="46" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
      h+=`<text x="360" y="${n.y+6}" text-anchor="middle" font-size="${n.t.length>18?13.5:15}" font-weight="700" fill="${fg}">${n.t}</text>`;
      if(n.kind==="p") h+=`<text x="223" y="${n.y-28}" font-size="11" font-weight="700" fill="${st}">wx+b</text>`;
      if(n.kind==="n") h+=`<text x="223" y="${n.y-28}" font-size="11" font-weight="700" fill="${st}">新！</text>`;
    }
    h+=`<text x="515" y="${n.y+5}" font-size="12" font-family="JetBrains Mono,monospace" fill="${mu}">${n.s}</text></g>`;
  });
  // moving pulse
  if(step && step.id){
    const y=byId[step.id].y;
    h+=`<circle cx="${byId[step.id].kind==="a"?392:205}" cy="${y}" r="8" fill="${flow}"><animate attributeName="r" values="6;10;6" dur="1s" repeatCount="indefinite"/></circle>`;
  }
  if(ph===1) h+=`<text x="360" y="1125" text-anchor="middle" font-size="14" font-weight="700" fill="${fg}">opt.zero_grad()：把所有参数上一轮留下的梯度清零</text>`;
  $("svg").innerHTML=h;
  $("svg").querySelectorAll(".node").forEach(g=>{
    const go=()=>{stop();k=-1;sel=g.dataset.id;render();};
    g.onclick=go; g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
  });
  // phases
  const cols=[css("--fwd"),css("--opStroke"),css("--bwd"),css("--upd")];
  [...$("phases").children].forEach((d,i)=>{d.className=i===ph?"on":"";d.style.background=i===ph?cols[i]:"";});
}

function card(){
  const step=T[k]||null, ph=step?step.ph:-1, id=step?step.id:sel;
  const tagCol={p:"--paramStroke",n:"--newStroke",o:"--opStroke",a:"--res"};
  const tagTxt={p:"wx+b，有参数要学",n:"新东西：注意力",o:"固定计算",a:"残差加法"};
  let html="";
  if(ph===1){
    html=`<h2>② 梯度清零</h2><p>上一轮反向传播留下的梯度还存在每个参数上（因为是 +=），不清零就会和这一轮的混在一起。</p><div class="code">opt.zero_grad()</div>`;
  } else if(ph===3){
    html=`<h2>④ 更新参数</h2><p>现在每个蓝色方块里的参数都拿到了自己的梯度。Adam 让它们各自往“让 loss 变小”的方向挪一小步：词向量表、位置表、Wq、Wk、Wv、Wo、W1、W2、W_head……全部一起改。</p><div class="code">opt.step()</div><p class="muted">然后换一批句子，回到 ① 重复几千次。这就是训练。灰色和橙色方块没有参数，不需要更新。</p>`;
  } else if(id){
    const n=byId[id];
    const head = ph===2 ? "③ 反向传播" : ph===0 ? "① 前向计算" : "";
    html=`${head?`<div class="shape">${head}　第 ${fwd.indexOf(id)+1}/${fwd.length} 步（从下往上数）</div>`:""}
      <h2>${n.t}</h2>
      <div><span class="tag" style="color:var(${tagCol[n.kind]});border-color:var(${tagCol[n.kind]})">${tagTxt[n.kind]}</span></div>
      <div class="shape">形状：${n.s}</div>
      <p>${(ph===2?n.b:n.f).replace(/\n/g,"<br>")}</p>
      ${n.code&&ph!==2?`<div class="code">${n.code}</div>`:""}
      ${ph===2?"":ph===-1?`<p class="muted">反向时：${n.b}</p>`:""}`;
  } else {
    html=`<h2>先看整体</h2>
      <p>整张图其实只有三种东西：</p>
      <p><b style="color:var(--paramStroke)">蓝色 = wx+b</b>，你已经会了。一共 6 处，所有要学的参数都在这里。</p>
      <p><b style="color:var(--newStroke)">橙色 = 多头注意力</b>，唯一的新东西：64 维切成 4 个头，各自让“吃”去看“小、明”，看的角度不同，最后拼回来。</p>
      <p><b style="color:var(--res)">紫色 = 残差</b>，一条把原始信息直接送上去、把梯度直接送下来的捷径。</p>
      <p class="muted">一步训练 = ① 从下往上算出 loss → ② 清零 → ③ 从上往下传梯度 → ④ 所有蓝色方块更新。按“下一步”开始。</p>`;
  }
  $("card").innerHTML=html;
}
function render(){draw();card();}
function stop(){clearInterval(timer);timer=null;$("play").textContent="▶ 播放";}
$("next").onclick=()=>{stop();k=Math.min(T.length-1,k+1);sel=null;render();};
$("prev").onclick=()=>{stop();k=Math.max(-1,k-1);sel=null;render();};
$("reset").onclick=()=>{stop();k=-1;sel=null;render();};
$("play").onclick=()=>{
  if(timer){stop();return;}
  if(k>=T.length-1)k=-1; sel=null;
  $("play").textContent="❚❚ 暂停";
  timer=setInterval(()=>{k++;render();if(k>=T.length-1)stop();},2600);
  k++;render();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
render();
</script>
